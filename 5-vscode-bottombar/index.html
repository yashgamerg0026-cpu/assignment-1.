<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: black;
    }

    .container{
        width: 1200px;
        margin: 0 auto;
        color: white;
        display: grid;
        grid-template-columns: 1fr 2fr;
    }

    .languagePanel {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        padding-inline: 2.5rem;
    }

    .languagePanel img {
        height: 40px;
        width: auto;
    }

    .div2{
        color: white;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        justify-content: center;
    }

    .flex{
        display: flex;
        align-items: center;
    }
</style>
<body>
    <div class="container">
        <div >
            <h1>Code in any language</h1>
            <p>VS Code supports almost major programming lanuage.
               Several ship in the box, like JavaScript,TypeScript,CSS,
               and HTML,but extensions for others can be found in the VS Code marketplace
            </p>
        </div>
        <div class="languagePanel">
            <div class="flex">
                <img src="https://code.visualstudio.com/assets/home/language-js.png" alt="Javascript">
                JavaScript
            </div>
            <div class="flex">
                <img src="https://code.visualstudio.com/assets/home/language-ts.png" alt="TypeScript">
                TypeScript
            </div>
            <div class="flex">
                <img src="https://code.visualstudio.com/assets/home/language-python.png" alt="Python">
                Python
            </div>
            <div class="flex">
                <img src="https://code.visualstudio.com/assets/home/language-cs.png" alt="C#">
                C#
            </div>
            <div class="flex">
                <img src="https://code.visualstudio.com/assets/home/language-cpp.png" alt="C++">
                C++
            </div>
            <div class="flex">
                <img src="https://code.visualstudio.com/assets/home/language-html.png" alt="HTML">
                HTML
            </div>
            <div class="flex">
                <img src="https://code.visualstudio.com/assets/home/language-java.png" alt="Java">
                Java
            </div>
            <div class="flex">
                <img src="https://code.visualstudio.com/assets/home/language-json.png" alt="JSON">
                JSON
            </div>
            <div class="flex">
                <img src="https://code.visualstudio.com/assets/home/language-php.png" alt="PHP">
                PHP
            </div>
            <div class="flex">
                <img src="https://code.visualstudio.com/assets/home/language-markdown.png" alt="Markdown">
                Markdown
            </div>
            <div class="flex">
                <img src="https://code.visualstudio.com/assets/home/language-powershell.png" alt="Powershell">
                Powershell
            </div>
            <div class="flex">
                <img src="https://code.visualstudio.com/assets/home/language-yaml.png" alt="YAML">
                YAML
            </div>
        </div>
    </div>
</body>
</html>
